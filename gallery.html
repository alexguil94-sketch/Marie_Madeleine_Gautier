<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="titles.gallery">Galerie — Marie-Madeleine Gautier</title>

  <script src="js/theme-init.js?v=1"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"/>

  <link rel="icon" href="favicon.ico?v=1" />
  <link rel="stylesheet" href="css/style.css?v=5" />
  <link rel="stylesheet" href="css/luxe.css?v=11" />
</head>

<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="section">
      <div class="container">
        <div class="card card-pad reveal">
          <div class="kicker" data-i18n="gallery.kicker">Galerie</div>
          <h1 style="margin:10px 0 0" data-i18n="gallery.title">Œuvres</h1>
          <p class="muted" style="max-width:820px" data-i18n="gallery.subtitle">
            Explore les œuvres, recherche par titre ou année, puis clique pour agrandir.
          </p>

          <div class="hr"></div>

          <!-- Filtres -->
          <div class="toolbar" style="margin-top:10px">
            <input id="q" class="field" type="search" placeholder="Rechercher (titre, année)..." data-i18n-placeholder="gallery.search" style="flex:1; min-width:220px" />
            <button id="aiSearch" class="btn ghost" type="button" data-i18n="gallery.aiSearch">Recherche IA</button>
            <button id="aiClear" class="btn ghost" type="button" hidden data-i18n="gallery.aiClear">Retour</button>
            <button id="loadMore" class="btn" type="button" data-i18n="gallery.loadMore">Charger plus</button>
          </div>

          <div id="aiStatus" class="muted small-note" style="margin-top:8px" aria-live="polite"></div>
          <div id="workCount" class="muted small-note" style="margin-top:10px"></div>

          <!-- Grid -->
          <div id="grid" class="gallery-grid" style="margin-top:16px"></div>
        </div>
      </div>
    </section>

    <!-- Newsletter -->
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="card card-pad reveal" style="text-align:center">
          <div class="kicker">Newsletter</div>
          <h2 style="margin:10px 0 6px">Restez dans la boucle</h2>
          <p class="muted" style="max-width:520px; margin:0 auto 22px">
            Nouvelles œuvres, expositions à venir — reçu directement dans votre boîte mail.
          </p>
          <form class="newsletter-form" data-source="galerie"
                style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:480px; margin:0 auto">
            <input class="field" type="email" name="email" placeholder="votre@email.fr" required
                   style="flex:1; min-width:220px" autocomplete="email" />
            <button type="submit" class="btn">S'abonner</button>
            <div class="newsletter-msg muted small-note" style="width:100%; text-align:center; min-height:20px"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true" hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Aperçu image" data-i18n-attr="aria-label:gallery.lightboxLabel" style="grid-template-rows:auto auto 1fr auto">
      <div class="lightbox-top">
        <div style="display:flex; align-items:center; gap:10px; min-width:0">
          <strong id="lbTitle" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis">—</strong>
          <span id="lbCount" class="lb-count"></span>
        </div>

        <div style="display:flex; gap:8px; align-items:center">
          <button class="pill" type="button" data-zoom="out" aria-label="Zoom arrière" data-i18n-attr="aria-label:gallery.zoomOut">−</button>
          <button class="pill" type="button" data-zoom="in" aria-label="Zoom avant" data-i18n-attr="aria-label:gallery.zoomIn">+</button>
          <button class="pill" type="button" data-zoom="reset" aria-label="Réinitialiser" data-i18n-attr="aria-label:gallery.resetZoom" data-i18n="gallery.resetZoom">Reset</button>
          <button class="pill" type="button" data-close aria-label="Fermer" data-i18n-attr="aria-label:common.close">×</button>
        </div>
      </div>

      <!-- Bande de métadonnées : statut, matériau, dimensions -->
      <div id="lbMeta" class="lightbox-meta" hidden></div>

      <div id="lbCanvas" class="lightbox-canvas">
        <img id="lbImg" alt="" draggable="false" />
        <button class="lb-nav prev" type="button" data-nav="prev" aria-label="Image précédente" data-i18n-attr="aria-label:gallery.prevImage">‹</button>
        <button class="lb-nav next" type="button" data-nav="next" aria-label="Image suivante" data-i18n-attr="aria-label:gallery.nextImage">›</button>
      </div>

      <div class="lightbox-bot">
        <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center; min-width:0">
          <span class="muted small-note" data-i18n="gallery.hintNav">← → : naviguer • ESC : fermer</span>
          <span class="muted small-note" data-i18n="gallery.hintZoom">Zoom : + / −</span>
        </div>
        <button id="lbDemander" type="button" class="btn" style="white-space:nowrap; flex-shrink:0">
          Demander cette œuvre
        </button>
      </div>
    </div>
  </div>

  <div id="siteFooter"></div>

  <!-- ✅ Scripts (ordre clean) -->
    <!-- ✅ Scripts (ordre clean) -->
  <script defer src="js/layout.js?v=3"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-config.js?v=1"></script>
  <script defer src="js/supabase-client.js?v=6"></script>

  <script defer src="js/profile-ui.js?v=8"></script>
  <script defer src="js/gallery.js?v=11"></script>
  <script defer src="js/newsletter.js?v=1"></script>

  <script defer src="js/theme.js?v=1"></script>
<script defer src="js/i18n.js?v=3"></script>
<script defer src="js/app.js?v=1"></script>
  <script defer src="js/luxe.js?v=10"></script>


  
</body>
</html>
